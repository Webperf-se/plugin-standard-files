# https://github.com/softprops/action-gh-release
name: Create Release
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
permissions:
  contents: read

# Queue runs instead of running them side by side, so a push and a manual
# run right after it can't both release the same version.
concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # [!] we need to checkout with tags and commit history
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x" # Version range or exact version of a Python version to use, using SemVer's version range syntax
          architecture: "x64" # optional x64 or x86. Defaults to x64 if not specified
      - name: Setup dependencies using pip
        run: pip install -r requirements.txt
      - name: 📋 Get Commits since last Release
        id: changes
        uses: simbo/changes-since-last-release-action@v1.0.1
        with:
          line-prefix: "* "
          include-hashes: false
      - name: Generate new release version
        id: newversion
        run: python tools/release.py -l "${{ steps.changes.outputs.last-tag }}"
      # NEW_VERSION stays empty when package.json does not hold the next
      # version (any other change to package.json on main).
      - name: Stop when there is no new version
        if: env.NEW_VERSION == ''
        run: echo "package.json does not hold a new version, nothing to release."
      - name: GitHub Release
        if: env.NEW_VERSION != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ env.NEW_VERSION }}"
          make_latest: "true"
          generate_release_notes: true
      - name: NPM Release (version specific)
        if: env.NEW_VERSION != ''
        uses: JS-DevTools/npm-publish@v4
        with:
          token: ${{ secrets.NPM_TOKEN }}
